<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - GrowthOps Outbound</title>
  <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">
      GrowthOps <span>Outbound</span>
    </div>
    <ul class="nav-links">
      <li><a href="/">Overview</a></li>
      <li><a href="/leads">Pipeline</a></li>
      <li><a href="/settings" class="active">Settings</a></li>
    </ul>
    <div>
      <a href="/" class="btn btn-secondary">← Back to Overview</a>
    </div>
  </nav>

  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <h1 style="font-size: 1.5rem; margin-bottom: 1.5rem;">System & Outreach Settings</h1>

    <div class="form-card">
      <form action="/settings" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
          <label>Engine Operation Mode</label>
          <select name="engine_mode">
            <option value="self" {% if settings.engine_mode == 'self' %}selected{% endif %}>
              Self-Growth (Internal Agency Leads)
            </option>
            <option value="client" {% if settings.engine_mode == 'client' %}selected{% endif %}>
              Client-Outreach (Client Delivery Mode)
            </option>
          </select>
        </div>

        <div class="form-group">
          <label>Public Booking URL (Cal.com / Calendly)</label>
          <input type="url" name="public_booking_url" value="{{ settings.public_booking_url or '' }}" required>
        </div>

        <div class="form-group">
          <label>Daily Outreach Hard Cap (Emails/Day)</label>
          <input type="number" name="daily_email_cap" value="{{ settings.daily_email_cap or '30' }}" min="5" max="100" required>
        </div>

        <div class="form-group">
          <label>SMTP Host</label>
          <input type="text" name="smtp_host" value="{{ config.SMTP_HOST }}" readonly style="opacity: 0.7;">
        </div>

        <div class="form-group">
          <label>SMTP Port</label>
          <input type="text" name="smtp_port" value="{{ config.SMTP_PORT }}" readonly style="opacity: 0.7;">
        </div>

        <button type="submit" class="btn">💾 Save Configuration</button>
      </form>
    </div>
  </main>
</body>
</html>
