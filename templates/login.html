<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Autonomous B2B Outbound Suite</title>
  <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">
  <div class="login-card">
    <div style="text-align: center; margin-bottom: 2rem;">
      <h1 style="font-size: 1.5rem; font-weight: 700; color: #fff;">
        GrowthOps <span style="color: var(--accent-cyan);">Outbound</span>
      </h1>
      <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.25rem;">
        Autonomous B2B Lead Generation & Booking Engine
      </p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="/login" method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group">
        <label>Admin Email</label>
        <input type="email" name="email" placeholder="admin@yourdomain.com" required autofocus value="admin@yourdomain.com">
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="••••••••••••" required value="admin_password_123">
      </div>

      <button type="submit" class="btn" style="width: 100%; justify-content: center; margin-top: 1rem;">
        🔐 Access Dashboard
      </button>
    </form>
  </div>
</body>
</html>
