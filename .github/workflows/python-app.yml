# GitHub Actions CI Workflow for CPA Lead Arbitrage & Payout Suite
name: Python application build and test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout repository
    - name: Checkout Codebase
      uses: actions/checkout@v4

    # 2. Setup Python environment
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip' # cache pip dependencies for faster builds

    # 3. Install system dependencies (ffmpeg required by MoviePy)
    - name: Install ffmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    # 4. Install Python dependencies
    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 5. Install Playwright runtimes and system libraries
    - name: Install Playwright Browsers & Dependencies
      run: |
        python -m playwright install --with-deps chromium

    # 6. Execute Transaction Isolation & Double-Spend Prevention Tests
    - name: Run Transaction Isolation Tests
      run: |
        python tests/verify_phase10_payouts.py
