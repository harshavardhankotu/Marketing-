# GitHub Actions CI for the Amazon Associates-compliant Affiliate Marketing Suite
name: Python application build and test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verify Local Backend
      env:
        POSTBACK_SECRET: ci_postback_secret
      run: |
        python tests/verify_local_backend.py

    - name: Verify Attribution & Redirects
      env:
        POSTBACK_SECRET: ci_postback_secret
      run: |
        python tests/verify_attribution.py

    - name: Verify Security Hardening
      env:
        POSTBACK_SECRET: ci_postback_secret
      run: |
        python tests/verify_security_hardened.py

    - name: Final E2E Pipeline Check
      env:
        POSTBACK_SECRET: ci_postback_secret
      run: |
        python tests/final_e2e_check.py
