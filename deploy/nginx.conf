# CPA Lead Arbitrage Nginx reverse proxy block
# Copy this to /etc/nginx/sites-available/affiliate and symlink to sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com;

    # Redirect all HTTP requests to HTTPS securely
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com;

    # SSL Certificate paths (e.g. provisioned via Certbot / Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    # SSL parameters for high security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Enable HTTP Strict Transport Security (HSTS)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Additional security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static assets direct serving (improves page load speeds significantly)
    location /static/ {
        alias /var/www/affiliate/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Reverse proxy public traffic to the internal Gunicorn socket
    location / {
        proxy_pass http://127.0.0.1:5000;
        
        # Buffer configurations for handling high-volume postback signals
        proxy_buffers 8 16k;
        proxy_buffer_size 32k;
        
        # Forward client identity metadata for Flask-Limiter rate limits
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts to handle longer vertical video rendering cycles (MoviePy)
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Access and Error logging
    access_log /var/log/nginx/affiliate_access.log;
    error_log /var/log/nginx/affiliate_error.log warn;
}
